# English site (the default, at the site root). The Chinese site (/zh/) uses ../../_pkgdown.yml.
# The files in pkgdown/en/ replace the Chinese ones in a temporary copy of the package when
# the site is built; build both with source("pkgdown/build_site.R").
url: https://jiewentsai.github.io/kitDesign/
lang: en

template:
  bootstrap: 5
  bootswatch: brite
  bslib:
    # Don't read brand/_brand.yml (bslib finds it on its own; its Google fonts would be downloaded into docs/)
    brand: false
    # KIT colors (appendix of brand/en/design-language.md)
    primary: "#006835"
    success: "#006835"
    body-bg: "#faf7f0"
    border-color: "#141414"
    border-width: 2px
    link-color: "#006835"
    link-hover-color: "#004d27"
    navbar-bg: "#c6d033"
    navbar-light-color: "#141414"
    navbar-light-hover-color: "#141414"
    headings-font-weight: 700
    # Fonts: the browser loads them from Google Fonts on demand (<link> in in_header). Not base_font,
    # because pkgdown would download every Google font file into docs/ (the rounded typeface is split into hundreds)
    font-family-base: "'Chiron GoRound TC', sans-serif"
    headings-font-family: "'Chiron GoRound TC', sans-serif"
    font-family-monospace: "'JetBrains Mono', 'Chiron GoRound TC', Menlo, Consolas, monospace"
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap">

home:
  title: "kitDesign: the shared Shiny interface of the KIT research tools"
  description: >
    One setup function puts the theme, styles, logo and header in place; documented kit_*()
    components build the page. Made for researchers aged 40–60: easy to read, safe to click,
    results first.

navbar:
  structure:
    left: [intro, components, design, reference, news]
    right: [lang, search, github]
  components:
    intro:
      text: Get started
      href: articles/kitDesign.html
    components:
      text: Components
      menu:
        - text: All components
          href: articles/components.html
        - text: Charts
          href: articles/charts.html
        - text: Use another brand
          href: articles/brand.html
        - text: Use it in Quarto documents
          href: articles/quarto.html
    design:
      text: Design language
      menu:
        - text: KIT design language
          href: articles/design-language.html
        - text: Versions and releases
          href: articles/release.html
        - text: Package development guide
          href: articles/package-guide.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Changelog
      href: news/index.html
    lang:
      # pkgdown/extra.js points it at the same page of the Chinese site
      text: 中文
      href: zh/index.html
      aria-label: 中文版
    github:
      icon: fa-github
      href: https://github.com/jiewenTsai/kitDesign
      aria-label: GitHub

articles:
  - title: Get started
    navbar: ~
    contents:
      - kitDesign
  - title: Components
    contents:
      - articles/components
      - articles/charts
      - articles/brand
      - articles/quarto
  - title: Design language
    contents:
